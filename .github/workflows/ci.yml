name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test including performance budgets
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Preserve full test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-test-results
        overwrite: true
        path: ./**/TestResults/*.trx
        retention-days: 5

    # Coverage instrumentation changes allocations and startup timing. Keep all
    # performance assertions in the uninstrumented full suite above.
    - name: Collect functional coverage
      run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=Performance" --collect:"XPlat Code Coverage"

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./**/coverage.cobertura.xml
        fail_ci_if_error: false
